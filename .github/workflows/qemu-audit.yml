name: QEMU storage audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out the QEMU device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xVanTuring/UniXNU-qemu
          ref: main
          path: device
          token: ${{ github.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc qemu
          if ! command -v unifdef >/dev/null; then brew install unifdef; fi

      - name: Select the QEMU configuration
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: ./unixnu defconfig qemu_defconfig

      - name: Build the package
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: ./unixnu build package

      - name: Build the kernel
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      - name: Build the payload
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: ./unixnu build payload

      - name: Run the original block-storage audit in QEMU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: |
          cd out/qemu/tree
          python3 scripts/build-storage-abi.py

      - name: Upload the storage audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qemu-storage-audit-${{ github.run_attempt }}
          path: |
            out/qemu/tree/build/storage-abi/interface-audit.json
            out/qemu/tree/build/darwinboot-storage-native-metadata/gdb-stop.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qemu-storage-audit-logs-${{ github.run_attempt }}
          path: |
            out/qemu/logs/*.log
            out/qemu/tree/build/storage-abi/*.log
          if-no-files-found: warn
          retention-days: 7
